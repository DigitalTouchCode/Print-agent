# Add inside the existing `server { ... }` block for apps.digitaltouch.co.zw
# (or digitaltouch.co.zw — wherever printAgentDownloadUrl/printAgentGuideUrl
# in pos.html should point). Doesn't touch the Django/Docker Compose stack —
# nginx serves these two files straight off disk.

location /downloads/ {
    alias /var/www/downloads/;
    autoindex off;

    # Windows shows a security prompt either way for an unsigned exe, but
    # forcing a download (rather than nginx guessing a mime type) avoids
    # any browser trying to "open" it inline.
    location ~ \.exe$ {
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/octet-stream";
    }
}

# Deploy step (manual, or wire into whatever deploy script/CI already
# updates the VPS):
#   mkdir -p /var/www/downloads
#   scp dt-print-agent-setup.exe user@vps:/var/www/downloads/
#   scp dt-print-agent-setup-guide.pdf user@vps:/var/www/downloads/
#   sudo nginx -s reload
#
# Or, pulling the GitHub Actions build straight onto the VPS instead of
# scp'ing from your laptop (needs a GitHub token with repo access, or make
# the repo/release public):
#   curl -L -o /var/www/downloads/dt-print-agent-setup.exe \
#     https://github.com/<you>/<repo>/releases/latest/download/dt-print-agent-setup.exe
